spring.application.name=veiculos

spring.datasource.url=jdbc:mysql://localhost:3306/veiculos
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
## Dialect explicito nao necessario em Hibernate 6 para MySQL moderno; comentado para evitar warnings
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Internationalization (i18n)
#spring.messages.basename=messages
#spring.messages.encoding=UTF-8

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Mailtrap Email Sending (Transactional)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=b2b99d842a4dda
spring.mail.password=1fd22a9bb73c92
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# From must match a verified sender/domain in Mailtrap Email Sending
app.mail.from=no-reply@seu-dominio-verificado.com


# Configuracoes de logging: define o arquivo de saida (logs/veiculos.log),
# o nivel padrao global (INFO) e um nivel mais detalhado (DEBUG) apenas para o pacote da aplicacao para facilitar a depuracao sem gerar excesso de logs de bibliotecas externas.
logging.file.name=logs/veiculos.log
logging.level.root=INFO
logging.level.com.veiculos=DEBUG